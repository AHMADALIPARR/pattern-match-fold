  <line x1="130" y1="105" x2="180" y2="105" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="105" x2="330" y2="105" stroke="#58a6ff" stroke-width="2"/>
  <line x1="430" y1="105" x2="480" y2="105" stroke="#58a6ff" stroke-width="2"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/></marker></defs>
