<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <rect width="700" height="300" fill="#0d1117"/>
  <text x="350" y="25" fill="#58a6ff" font-size="16" text-anchor="middle" font-family="sans-serif">Pattern-Fold Data Flow</text>
  <rect x="30" y="80" width="100" height="50" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="80" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle" font-family="sans-serif">Stream</text>
  <rect x="180" y="80" width="100" height="50" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="230" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle" font-family="sans-serif">Seed ⊕ lane</text>
  <rect x="330" y="80" width="100" height="50" rx="6" fill="#161b22" stroke="#58a6ff"/>
  <text x="380" y="110" fill="#c9d1d9" font-size="11" text-anchor="middle" font-family="sans-serif">Shift-XOR</text>
